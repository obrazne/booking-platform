<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Pomoc — administrácia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f6f2}
.q{transition:background 150ms ease}
.q:hover,.q:focus-visible{background:#faf9f6 !important}
.chip{transition:background 150ms ease,border-color 150ms ease}
.chip:hover{background:#efede7 !important;border-color:#b9b4a7 !important}
.lnk:hover{text-decoration:underline}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1240px; background: #f7f6f2; font-family: 'Roboto', system-ui, sans-serif; font-weight: 300; color: #3b3d42;">
<div style="flex: 0 0 248px; display: flex;"><dc-import name="Sidebar" active="prehlad" hint-size="248px,1000px"></dc-import></div>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
<div style="padding: 36px 40px 56px; display: flex; flex-direction: column; gap: 28px;">

<div style="display: flex; flex-direction: column; gap: 10px; max-width: 760px;">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: #ad5a2b;">Pomoc</span>
<h1 style="margin: 0; font-size: 36px; line-height: 1.1; font-weight: 800; letter-spacing: -0.03em; color: #11212f;">S čím vám pomôžeme? <span style="color: #8b929b;">Väčšinu nájdete tu.</span></h1>
<label style="display: flex; align-items: center; gap: 10px; min-height: 52px; margin-top: 8px; padding: 0 18px; border-radius: 9999px; border: 1px solid #b9b4a7; background: #ffffff; color: #5a6672;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="search" placeholder="Napíšte, čo hľadáte — napr. upratovanie, platba, Booking…" style="flex: 1 1 auto; min-width: 0; border: none; background: transparent; font-family: inherit; font-size: 16px; color: #11212f; outline: none;"></label>
</div>

<div role="group" aria-label="Témy" style="display: flex; flex-wrap: wrap; gap: 8px;">
<sc-for list="{{topics}}" as="t" hint-placeholder-count="6"><button type="button" class="chip" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}} <span style="opacity: 0.7;">{{t.count}}</span></button></sc-for>
</div>

<div style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 24px; align-items: start;">

<section aria-label="Otázky" style="background: #ffffff; border: 1px solid #e3e1da; border-radius: 12px; overflow: hidden;">
<sc-for list="{{faqs}}" as="f" hint-placeholder-count="6"><div style="border-bottom: 1px solid #ecebe6;">
<button type="button" class="q" onClick="{{f.toggle}}" aria-expanded="{{f.openAttr}}" style="{{f.btnStyle}}"><span style="flex: 1 1 auto; text-align: left; font-size: 15px; font-weight: 500; color: #11212f;">{{f.q}}</span><span style="flex-shrink: 0; font-size: 12px; color: #5a6672;">{{f.topic}}</span><svg style="{{f.chev}}" width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5"></path></svg></button>
<sc-if value="{{f.open}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-direction: column; gap: 12px; padding: 0 24px 22px;">
<sc-for list="{{f.steps}}" as="s" hint-placeholder-count="3"><div style="display: flex; gap: 12px; align-items: baseline;"><span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 9999px; background: #e6efeb; color: #2f5d50; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;">{{s.n}}</span><span style="font-size: 14.5px; line-height: 1.55; color: #3b3d42;">{{s.text}}</span></div></sc-for>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding-top: 4px;"><a href="#" style="display: inline-flex; align-items: center; min-height: 38px; padding: 0 16px; border-radius: 9999px; background: {{accent}}; color: #ffffff; font-size: 13.5px; font-weight: 700; text-decoration: none;">{{f.go}}</a><span style="font-size: 13px; color: #5a6672;">Pomohlo vám to? <button type="button" style="border: none; background: none; padding: 0 4px; font-family: inherit; font-size: 13px; font-weight: 500; color: #11212f; cursor: pointer; text-decoration: underline;">Áno</button> · <button type="button" style="border: none; background: none; padding: 0 4px; font-family: inherit; font-size: 13px; font-weight: 500; color: #11212f; cursor: pointer; text-decoration: underline;">Nie</button></span></div>
</div></sc-if>
</div></sc-for>
</section>

<aside style="display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 12px; background: #ffffff; border: 1px solid #e3e1da;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 18px; font-weight: 700; color: #11212f;">Nenašli ste odpoveď?</span>
<span style="font-size: 14px; line-height: 1.55; color: #5a6672;">Napíšte nám. Odpovieme e-mailom do [DOBA ODPOVEDE].</span>
</div>
<label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 13px; font-weight: 500; color: #11212f;">S čím potrebujete pomôcť?</span><textarea rows="5" placeholder="Popíšte, čo ste chceli urobiť a čo sa stalo…" style="box-sizing: border-box; width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #b9b4a7; background: #ffffff; font-family: inherit; font-size: 14px; line-height: 1.5; color: #11212f; resize: vertical;"></textarea></label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: #3b3d42;"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #2f5d50;">Priložiť snímku obrazovky</label>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 10px; background: #f4f3ef; font-size: 12.5px; line-height: 1.5; color: #5a6672;"><span style="font-weight: 500; color: #3b3d42;">Pošle sa aj, aby sme sa nemuseli dopytovať:</span><span>Chalet STRÖMY · Jana Hladká · stránka Blokácie · prehliadač</span></div>
<button type="button" style="min-height: 44px; border-radius: 9999px; border: none; background: {{accent}}; font-family: inherit; font-size: 14px; font-weight: 700; color: #ffffff; cursor: pointer;">Odoslať</button>
</aside>
</div>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2f5d50","options":["#2f5d50","#2e5ea8","#11212f"]},"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { topic: 'all', open: 0 }; }
  renderVals() {
    var self = this;
    var a = this.props.accent ?? '#2f5d50';
    var all = [
      { q: 'Ako zablokujem termín, keď idem upratovať?', topic: 'Kalendár a portály', go: 'Otvoriť Blokácie', steps: ['V menu otvorte Rezervácie › Blokácie a kliknite na „+ Pridať blokáciu“.', 'Vyberte prvú noc a deň, keď je chalet znova voľný. Poznámku (napr. „jarné upratovanie“) vidíte len vy.', 'Kliknite na Blokovať. Na vašej stránke je termín hneď obsadený, na Bookingu a Airbnb po najbližšej synchronizácii.'] },
      { q: 'Hosť zaplatil prevodom. Čo mám urobiť?', topic: 'Platby', go: 'Otvoriť Rezervácie', steps: ['Otvorte rezerváciu v zozname Rezervácie.', 'Kliknite na „Platba prijatá“. Hosť dostane potvrdenie e-mailom automaticky.'] },
      { q: 'Prečo vidím kolíziu s Airbnb alebo Bookingom?', topic: 'Kalendár a portály', go: 'Otvoriť Kolízie', steps: ['Portál poslal termín, ktorý sa prekrýva s rezerváciou alebo blokáciou u vás. Nič sme neprepísali.', 'Otvorte kolíziu — uvidíte, čo s čím koliduje, a odporúčaný postup.'] },
      { q: 'Ako zmením cenu na Vianoce a Silvester?', topic: 'Ceny a pravidlá pobytu', go: 'Otvoriť Ceny a sezóny', steps: ['Otvorte Objekt › Ceny a sezóny a rozbaľte sezónu Vianoce a Silvester.', 'Zmeňte cenu za noc alebo minimum nocí a uložte. Platí pre nové rezervácie, potvrdené ostávajú za pôvodnú cenu.'] },
      { q: 'Kedy hosť dostane pokyny a kód od dverí?', topic: 'Hostia a správy', go: 'Otvoriť Automatické správy', steps: ['Pokyny k príchodu odchádzajú samy pred príchodom (predvolene 3 dni vopred) a hosť ich vidí aj vo svojom účte.', 'Čas zmeníte v Správy › Automatické správy.'] },
      { q: 'Ako pridám upratovačku alebo ďalšieho človeka?', topic: 'Nastavenia', go: 'Otvoriť Tím', steps: ['Otvorte Nastavenia › Tím a pridajte človeka s e-mailom.', 'Vyberte rolu — čo smie vidieť a meniť.'] }
    ];
    var topics = [['all', 'Všetko'], ['Kalendár a portály', 'Kalendár a portály'], ['Platby', 'Platby'], ['Ceny a pravidlá pobytu', 'Ceny a pravidlá pobytu'], ['Hostia a správy', 'Hostia a správy'], ['Nastavenia', 'Nastavenia']];
    var cur = this.state.topic;
    var list = all.filter(function (f) { return cur === 'all' || f.topic === cur; });
    return {
      accent: a,
      topics: topics.map(function (t) {
        var on = t[0] === cur;
        var n = t[0] === 'all' ? all.length : all.filter(function (f) { return f.topic === t[0]; }).length;
        return { label: t[1], count: n, on: on ? 'true' : 'false', pick: function () { self.setState({ topic: t[0], open: -1 }); },
          style: 'min-height: 38px; padding: 0 14px; border-radius: 9999px; border: 1px solid ' + (on ? '#11212f' : '#c9c5ba') + '; background: ' + (on ? '#11212f' : '#ffffff') + '; color: ' + (on ? '#ffffff' : '#11212f') + '; font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer;' };
      }),
      faqs: list.map(function (f, i) {
        var op = self.state.open === i;
        return { q: f.q, topic: f.topic, go: f.go, open: op, openAttr: op ? 'true' : 'false',
          steps: f.steps.map(function (s, j) { return { n: j + 1, text: s }; }),
          toggle: function () { self.setState({ open: op ? -1 : i }); },
          btnStyle: 'display: flex; align-items: center; gap: 16px; width: 100%; min-height: 58px; padding: 0 24px; border: none; background: ' + (op ? '#faf9f6' : '#ffffff') + '; font-family: inherit; cursor: pointer;',
          chev: 'flex-shrink: 0; color: #5a6672; transform: rotate(' + (op ? 180 : 0) + 'deg);' };
      })
    };
  }
}
</script>
</body>
</html>
