<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Bočné menu administrácie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.nav-a{transition:background 140ms ease,color 140ms ease}
.nav-a:hover{background:#efeee9}
</style>
</helmet>
<nav aria-label="Hlavné menu" style="width: 248px; min-height: 100%; height: 100%; box-sizing: border-box; padding: 18px 14px; background: #f7f6f2; border-right: 1px solid #e9e5db; display: flex; flex-direction: column; gap: 18px; font-family: 'Roboto', system-ui, sans-serif; color: #3b3d42;">
<div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px;">
<span style="width: 30px; height: 30px; border-radius: 8px; background: {{accent}}; display: inline-flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16"></path><path d="M9 14.5l2 2 4-4"></path></svg></span>
<span style="font-size: 15px; font-weight: 800; letter-spacing: -0.01em; color: #11212f;">[Názov platformy]</span>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 48px; padding: 8px 12px; border-radius: 10px; border: 1px solid #e3e1da; background: #ffffff; cursor: pointer; text-align: left;">
<span style="display: flex; flex-direction: column; gap: 1px;"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #8b929b;">Ubytovanie</span><span style="font-size: 14px; font-weight: 700; color: #11212f;">Chalet STRÖMY</span></span>
<svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="#5a6672" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5L6 2l3 2.5"></path><path d="M3 7.5L6 10l3-2.5"></path></svg>
</button>
<div style="display: flex; flex-direction: column; gap: 2px;">
<a href="#" class="nav-a" style="{{s.prehlad}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Prehľad</a>
<a href="#" class="nav-a" style="{{s.rezervacie}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v16H5z"></path><path d="M9 9h6"></path><path d="M9 13h6"></path><path d="M9 17h3"></path></svg>Rezervácie<span style="{{badgeStyle}}">1</span></a>
<a href="#" class="nav-a" style="{{s.kalendar}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>Kalendár</a>
<a href="#" class="nav-a" style="{{s.objekty}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg>Objekt a stránka</a>
<a href="#" class="nav-a" style="{{s.sluzby}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18h16"></path><path d="M6 18a6 6 0 0 1 12 0"></path><path d="M12 9V7"></path><path d="M10 7h4"></path></svg>Služby</a>
<a href="#" class="nav-a" style="{{s.referencie}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14v10H9l-4 4z"></path></svg>Referencie</a>
</div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="padding: 0 12px 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #8b929b;">Obsadenosť</span>
<a href="#" class="nav-a" style="{{s.blokacie}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M9 14l6 5"></path><path d="M15 14l-6 5"></path></svg>Blokácie</a>
<a href="#" class="nav-a" style="{{s.ical}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7a8 8 0 0 0-14-2L4 7"></path><path d="M4 3v4h4"></path><path d="M4 17a8 8 0 0 0 14 2l2-2"></path><path d="M20 21v-4h-4"></path></svg>Booking a Airbnb</a>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding-top: 14px; border-top: 1px solid #e9e5db;">
<a href="#" class="nav-a" style="{{s.tim}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"></path><circle cx="17" cy="9" r="2.4"></circle><path d="M15.5 14.2c2.6.2 5 1.9 5 4.8"></path></svg>Tím</a>
<a href="#" class="nav-a" style="{{s.nastavenia}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path><path d="M5 5l2 2"></path><path d="M17 17l2 2"></path><path d="M5 19l2-2"></path><path d="M17 7l2-2"></path></svg>Nastavenia</a>
<a href="#" class="nav-a" style="{{s.platforma}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"></path></svg>Riadiace centrum</a>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 8px 0;">
<span style="width: 32px; height: 32px; border-radius: 9999px; background: #e7e4dc; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #3b3d42;">{{initials}}</span>
<span style="display: flex; flex-direction: column; min-width: 0;"><span style="font-size: 13px; font-weight: 500; color: #11212f;">{{userName}}</span><span style="font-size: 12px; color: #8b929b;">Čo je nové · Odhlásiť</span></span>
</div>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"prehlad","options":["prehlad","rezervacie","kalendar","objekty","sluzby","referencie","blokacie","ical","tim","nastavenia","platforma"]},"userName":{"editor":"text","default":"Jana Hladká"},"accent":{"editor":"color","default":"#2f5d50","options":["#2f5d50","#2e5ea8","#11212f","#8a5a3c"]},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var a = this.props.accent ?? '#2f5d50';
    var active = this.props.active ?? 'prehlad';
    var h = a.replace('#', ''); var rgb = [0, 2, 4].map(function (i) { return parseInt(h.slice(i, i + 2), 16); });
    var keys = ['prehlad', 'rezervacie', 'kalendar', 'objekty', 'sluzby', 'referencie', 'blokacie', 'ical', 'tim', 'nastavenia', 'platforma'];
    var s = {};
    keys.forEach(function (k) {
      var on = k === active;
      s[k] = 'display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: ' + (on ? '700' : '500') + '; color: ' + (on ? a : '#3b3d42') + '; background: ' + (on ? 'rgba(' + rgb.join(',') + ',0.10)' : 'transparent') + ';';
    });
    var name = this.props.userName ?? 'Jana Hladká';
    var initials = name.split(' ').map(function (p) { return p.charAt(0); }).join('').slice(0, 2).toUpperCase();
    return {
      accent: a, s: s, userName: name, initials: initials,
      badgeStyle: 'margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 9999px; background: #f6ecdf; color: #8a4a22; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;'
    };
  }
}
</script>
</body>
</html>
