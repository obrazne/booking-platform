<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Bočné menu administrácie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.nav-a{transition:background 140ms ease,color 140ms ease}
.nav-a:hover{background:#efede7}
.chev{transition:transform 180ms ease}
</style>
</helmet>
<nav aria-label="Hlavné menu" style="width: 248px; min-height: 100%; height: 100%; box-sizing: border-box; padding: 18px 0; background: #f7f6f2; border-right: 1px solid #e9e5db; display: flex; flex-direction: column; gap: 18px; font-family: 'Roboto', system-ui, sans-serif; color: #3b3d42;">
<div style="display: flex; align-items: center; gap: 10px; padding: 4px 20px;">
<span style="width: 30px; height: 30px; border-radius: 8px; background: {{accent}}; display: inline-flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16"></path><path d="M9 14.5l2 2 4-4"></path></svg></span>
<span style="font-size: 15px; font-weight: 800; letter-spacing: -0.01em; color: #11212f;">[Názov platformy]</span>
</div>
<div style="display: flex; flex-direction: column; gap: 1px; padding: 6px 20px 12px; border-bottom: 1px solid #e9e5db;">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #5a6672;">Ubytovanie</span>
<span style="font-size: 14px; font-weight: 700; color: #11212f;">Chalet STRÖMY</span>
</div>

<div style="display: flex; flex-direction: column; gap: 2px;">
<a href="#" class="nav-a" style="{{s.prehlad}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Prehľad</a>

<div aria-hidden="true" style="height: 1px; background: #e7e4dc; margin: 3px 0;"></div>
<button type="button" class="nav-a" onClick="{{t.rez}}" aria-expanded="{{x.rez}}" style="{{g.rez}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v16H5z"></path><path d="M9 9h6"></path><path d="M9 13h6"></path><path d="M9 17h3"></path></svg><span style="flex: 1 1 auto; text-align: left;">Rezervácie</span><span style="{{badgeStyle}}">1</span><svg class="chev" style="{{c.rez}}" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"></path></svg></button>
<sc-if value="{{o.rez}}" hint-placeholder-val="{{true}}"><div style="display: flex; flex-direction: column; gap: 1px; margin: 0 0 4px;"><a href="#" class="nav-a" style="{{s.rezervacie}}">Zoznam</a><a href="#" class="nav-a" style="{{s.kalendar}}">Kalendár</a><a href="#" class="nav-a" style="{{s.blokacie}}">Blokácie</a></div></sc-if>

<div aria-hidden="true" style="height: 1px; background: #e7e4dc; margin: 3px 0;"></div>
<button type="button" class="nav-a" onClick="{{t.spr}}" aria-expanded="{{x.spr}}" style="{{g.spr}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M8 9h8"></path><path d="M8 12.5h5"></path></svg><span style="flex: 1 1 auto; text-align: left;">Správy</span><span style="{{msgBadgeStyle}}">2</span><svg class="chev" style="{{c.spr}}" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"></path></svg></button>
<sc-if value="{{o.spr}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-direction: column; gap: 1px; margin: 0 0 4px;"><a href="#" class="nav-a" style="{{s.spravy}}">Schránka</a><a href="#" class="nav-a" style="{{s.automaticke}}">Automatické správy</a></div></sc-if>

<div aria-hidden="true" style="height: 1px; background: #e7e4dc; margin: 3px 0;"></div>
<button type="button" class="nav-a" onClick="{{t.obj}}" aria-expanded="{{x.obj}}" style="{{g.obj}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg><span style="flex: 1 1 auto; text-align: left;">Objekt</span><svg class="chev" style="{{c.obj}}" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"></path></svg></button>
<sc-if value="{{o.obj}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-direction: column; gap: 1px; margin: 0 0 4px;"><a href="#" class="nav-a" style="{{s.objekty}}">Údaje</a><a href="#" class="nav-a" style="{{s.fotky}}">Fotky</a><a href="#" class="nav-a" style="{{s.ceny}}">Ceny a sezóny</a><a href="#" class="nav-a" style="{{s.stranka}}">Stránka</a><a href="#" class="nav-a" style="{{s.dokumenty}}">Dokumenty</a></div></sc-if>

<div aria-hidden="true" style="height: 1px; background: #e7e4dc; margin: 3px 0;"></div>
<button type="button" class="nav-a" onClick="{{t.pon}}" aria-expanded="{{x.pon}}" style="{{g.pon}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18h16"></path><path d="M6 18a6 6 0 0 1 12 0"></path><path d="M12 9V7"></path><path d="M10 7h4"></path></svg><span style="flex: 1 1 auto; text-align: left;">Ponuka</span><svg class="chev" style="{{c.pon}}" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"></path></svg></button>
<sc-if value="{{o.pon}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-direction: column; gap: 1px; margin: 0 0 4px;"><a href="#" class="nav-a" style="{{s.sluzby}}">Doplnkové služby</a><a href="#" class="nav-a" style="{{s.referencie}}">Referencie</a></div></sc-if>

<div aria-hidden="true" style="height: 1px; background: #e7e4dc; margin: 3px 0;"></div>
<a href="#" class="nav-a" style="{{s.statistiky}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16"></path><path d="M5 15l4-5 4 3 6-7"></path></svg>Štatistiky</a>


</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding-top: 14px; border-top: 1px solid #e9e5db;">
<a href="#" class="nav-a" style="{{settingsStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path><path d="M5 5l2 2"></path><path d="M17 17l2 2"></path><path d="M5 19l2-2"></path><path d="M17 7l2-2"></path></svg>Nastavenia</a>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 20px 0;">
<span style="width: 32px; height: 32px; border-radius: 9999px; background: #e7e4dc; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #3b3d42;">{{initials}}</span>
<span style="display: flex; flex-direction: column; min-width: 0;"><span style="font-size: 13px; font-weight: 500; color: #11212f;">{{userName}}</span><span style="font-size: 12px; color: #5a6672;">Čo je nové · Odhlásiť</span></span>
</div>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"prehlad","options":["prehlad","rezervacie","kalendar","blokacie","spravy","automaticke","objekty","fotky","ceny","stranka","dokumenty","sluzby","referencie","statistiky","ical","nastavenia","tim","platby","emaily","platforma"]},"userName":{"editor":"text","default":"Jana Hladká"},"accent":{"editor":"color","default":"#2f5d50","options":["#2f5d50","#2e5ea8","#11212f","#8a5a3c"]},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: null }; }
  renderVals() {
    var self = this;
    var a = this.props.accent ?? '#2f5d50';
    var active = this.props.active ?? 'prehlad';
    var h = a.replace('#', ''); var rgb = [0, 2, 4].map(function (i) { return parseInt(h.slice(i, i + 2), 16); });
    var soft = 'rgba(' + rgb.join(',') + ',0.10)';
    var GROUP = { rezervacie: 'rez', kalendar: 'rez', blokacie: 'rez', spravy: 'spr', automaticke: 'spr', objekty: 'obj', fotky: 'obj', ceny: 'obj', stranka: 'obj', dokumenty: 'obj', sluzby: 'pon', referencie: 'pon', ical: 'pre', nastavenia: 'nas', tim: 'nas', platby: 'nas', emaily: 'nas' };
    var activeGroup = GROUP[active] || null;
    var open = this.state.open || {};
    var isOpen = function (g) { return open[g] !== undefined ? open[g] : g === activeGroup; };
    var top = ['prehlad', 'statistiky'];
    var s = {};
    Object.keys(GROUP).concat(top).forEach(function (k) {
      var on = k === active; var sub = !!GROUP[k];
      s[k] = 'display: flex; align-items: center; gap: 12px; min-height: ' + (sub ? 34 : 40) + 'px; padding: 0 20px 0 ' + (sub ? 50 : 20) + 'px; border-radius: 0; text-decoration: none; font-size: ' + (sub ? 13.5 : 14) + 'px; font-weight: ' + (on ? '700' : (sub ? '400' : '500')) + '; color: ' + (on ? a : (sub ? '#3b3d42' : '#3b3d42')) + '; background: ' + (on ? soft : 'transparent') + '; box-shadow: ' + (on ? 'inset 3px 0 0 ' + a : 'none') + ';';
    });
    var g = {}, c = {}, t = {}, o = {}, x = {};
    ['rez', 'spr', 'obj', 'pon', 'pre', 'nas'].forEach(function (k) {
      var on = k === activeGroup; var op = isOpen(k);
      g[k] = 'display: flex; align-items: center; gap: 12px; width: 100%; min-height: 40px; padding: 0 20px; border: none; border-radius: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: ' + (on ? '700' : '500') + '; color: ' + (on ? '#11212f' : '#3b3d42') + '; cursor: pointer;';
      c[k] = 'flex-shrink: 0; color: #8b929b; transform: rotate(' + (op ? 90 : 0) + 'deg);';
      o[k] = op; x[k] = op ? 'true' : 'false';
      t[k] = function () { var n = Object.assign({}, self.state.open || {}); n[k] = !isOpen(k); self.setState({ open: n }); };
    });
    var setOn = ['nastavenia', 'tim', 'platby', 'emaily', 'ical'].indexOf(active) >= 0;
    var settingsStyle = 'display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 20px; text-decoration: none; font-size: 14px; font-weight: ' + (setOn ? '700' : '500') + '; color: ' + (setOn ? a : '#3b3d42') + '; background: ' + (setOn ? soft : 'transparent') + '; box-shadow: ' + (setOn ? 'inset 3px 0 0 ' + a : 'none') + ';';
    var name = this.props.userName ?? 'Jana Hladká';
    var initials = name.split(' ').map(function (p) { return p.charAt(0); }).join('').slice(0, 2).toUpperCase();
    return {
      accent: a, settingsStyle: settingsStyle, s: s, g: g, c: c, t: t, o: o, x: x, userName: name, initials: initials,
      msgBadgeStyle: 'min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 9999px; background: #c2552d; color: #ffffff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;',
      badgeStyle: 'min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 9999px; background: #f6ecdf; color: #8a4a22; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;'
    };
  }
}
</script>
</body>
</html>
