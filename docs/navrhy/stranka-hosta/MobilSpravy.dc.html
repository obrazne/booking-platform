<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Mobil — správy s Janou</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Roboto',system-ui,sans-serif;color:#3b3d42;background:#ffffff;-webkit-font-smoothing:antialiased}
button,textarea{font-family:inherit}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
textarea:focus{outline:none}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg-new{animation:msgIn 220ms cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){.msg-new{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #ffffff; font-weight: 300; display: flex; flex-direction: column;">
<div style="flex-shrink: 0; padding: 10px 12px 10px 8px; border-bottom: 1px solid #e9e5db; display: flex; align-items: center; gap: 8px;">
<a href="#" aria-label="Späť na pobyt" style="width: 40px; height: 40px; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#11212f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="width: 36px; height: 36px; border-radius: 9999px; background: #d9dcd8; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #3b3d42;">JH</span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 1px; min-width: 0;"><span style="font-size: 16px; font-weight: 700; color: #11212f;">Jana Hladká</span><span style="font-size: 12px; color: #5a6672;">Pobyt 22. – 26. 12. · Chalet STRÖMY</span></span>
<a href="#" aria-label="Zavolať Jane" style="width: 40px; height: 40px; border-radius: 9999px; border: 1px solid #e9e5db; display: inline-flex; align-items: center; justify-content: center; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#11212f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></a>
</div>

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 8px; background: #fbfaf7;">
<sc-for list="{{items}}" as="m" hint-placeholder-count="6">
<sc-if value="{{m.isDay}}" hint-placeholder-val="{{false}}"><span class="mono" style="{{m.dayStyle}}">{{m.label}}</span></sc-if>
<sc-if value="{{m.isMsg}}" hint-placeholder-val="{{true}}"><div class="{{m.cls}}" style="{{m.wrap}}"><div style="{{m.bubble}}">{{m.text}}</div><span style="font-size: 11px; color: #8b929b; padding: 0 4px;">{{m.meta}}</span></div></sc-if>
</sc-for>
</div>

<div style="flex-shrink: 0; border-top: 1px solid #e9e5db; padding: 10px 12px 20px; display: flex; flex-direction: column; gap: 6px; background: #ffffff;">
<div style="display: flex; align-items: flex-end; gap: 8px;">
<textarea aria-label="Správa pre Janu" rows="1" placeholder="Správa pre Janu…" value="{{draft}}" onChange="{{type}}" style="flex: 1 1 auto; min-height: 44px; max-height: 120px; box-sizing: border-box; resize: none; border: 1px solid #dcd9d1; border-radius: 22px; padding: 11px 16px; font-size: 16px; line-height: 1.4; color: #11212f; background: #ffffff;"></textarea>
<button type="button" onClick="{{send}}" aria-label="Odoslať" style="flex-shrink: 0; width: 44px; height: 44px; border: none; border-radius: 9999px; background: {{sendBg}}; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M6 11l6-6 6 6"></path></svg></button>
</div>
<span style="font-size: 11px; color: #8b929b; padding: 0 6px;">V núdzi volajte — ikona telefónu hore.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2f5d50","options":["#2f5d50","#2e5ea8","#11212f","#8a5a3c"]},"accent2":{"editor":"color","default":"#ad5a2b","options":["#ad5a2b","#b8862f","#9a4f6b","#3d6a8a"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { draft: '', sent: [] }; }
  renderVals() {
    var self = this, s = this.state;
    var accent = this.props.accent ?? '#2f5d50';
    var accent2 = this.props.accent2 ?? '#ad5a2b';
    var base = [
      { k: 'day', label: 'Po 16. 12.' },
      { k: 'guest', text: 'Dobrý deň, prídeme asi až okolo 20:00, nevadí to? A dalo by sa pripraviť detskú postieľku?', time: '14:12' },
      { k: 'owner', text: 'Dobrý deň, Tomáš, neskorý príchod je v poriadku — kód od dverí uvidíte v pokynoch deň pred príchodom. Postieľku pripravím do spálne na prízemí.', time: '15:40' },
      { k: 'guest', text: 'Super, ďakujeme!', time: '15:52' },
      { k: 'day', label: 'Dnes · nová správa', isNew: true },
      { k: 'owner', text: 'Dobrý deň, o tri dni sa vidíme. Na cestu potrebujete zimné pneumatiky, posledných 300 m ide do kopca. Raňajky alebo saunu si objednáte priamo v pobyte. Jana', time: '10:00' }
    ];
    var all = base.concat(s.sent.map(function (t) { return { k: 'guest', text: t, time: 'teraz', fresh: true }; }));
    var items = all.map(function (m) {
      var mine = m.k === 'guest';
      return {
        isDay: m.k === 'day', isMsg: m.k !== 'day', label: m.label || '', text: m.text || '', cls: m.fresh ? 'msg-new' : '',
        dayStyle: 'align-self: center; margin: 8px 0 2px; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: ' + (m.isNew ? accent2 : '#8b929b') + ';',
        wrap: 'display: flex; flex-direction: column; gap: 3px; max-width: 82%; align-self: ' + (mine ? 'flex-end' : 'flex-start') + '; align-items: ' + (mine ? 'flex-end' : 'flex-start') + ';',
        bubble: 'padding: 10px 14px; border-radius: ' + (mine ? '18px 18px 4px 18px' : '18px 18px 18px 4px') + '; background: ' + (mine ? accent : '#ffffff') + '; border: 1px solid ' + (mine ? accent : '#ebe8e0') + '; color: ' + (mine ? '#ffffff' : '#11212f') + '; font-size: 15px; font-weight: 400; line-height: 1.5;',
        meta: mine ? m.time : 'Jana · ' + m.time
      };
    });
    return {
      items: items, draft: s.draft, sendBg: s.draft.trim() ? accent : '#c9ccc9',
      type: function (e) { self.setState({ draft: e.target.value }); },
      send: function () { var t = self.state.draft.trim(); if (!t) return; self.setState({ sent: self.state.sent.concat([t]), draft: '' }); }
    };
  }
}
</script>
</body>
</html>
