# Nightly backup of staging (Z50): the free Supabase plan makes no backups. Database dump (roles, schema, data) and
# every Storage file, restored in the same run into a clean Supabase database and compared table by table, then
# encrypted with `age` (public key only — the private key is Martin's) and kept 14 days as a run artifact.
# Nothing unencrypted leaves the runner. Postup obnovy: docs/prevadzka/zaloha-a-obnova.md.
# "selftest" (manual): the same steps on a local database built from the migrations and the seed — checks the
# mechanics without the staging secrets; nothing is uploaded.
name: Záloha stagingu

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "staging = záloha stagingu, selftest = skúška postupu na lokálnej databáze"
        type: choice
        options: [staging, selftest]
        default: staging

permissions:
  contents: read

concurrency:
  group: backup-staging
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE: ${{ github.event.inputs.source || 'staging' }}
      # Not a secret: the public URL of the staging project (CLAUDE.md).
      SUPABASE_URL: https://uzsuwokyiprkzfirvrmb.supabase.co
      RESTORED_DB: postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Secrets present
        id: secrets
        env:
          DB: ${{ secrets.STAGING_DB_URL }}
          KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
          AGE: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          if [ "$SOURCE" = "staging" ] && { [ -z "$DB" ] || [ -z "$KEY" ] || [ -z "$AGE" ]; }; then
            echo "::error::Chýbajú tajné hodnoty STAGING_DB_URL, STAGING_SERVICE_ROLE_KEY alebo BACKUP_AGE_PUBLIC_KEY (docs/prevadzka/zaloha-a-obnova.md)."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Tools (age, psql)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age postgresql-client

      - name: "Selftest: local source database from the migrations and the seed"
        if: env.SOURCE == 'selftest'
        run: |
          supabase db start
          supabase db reset
          echo "SOURCE_DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"

      - name: Dump the database (roles, schema, data)
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          url="${SOURCE_DB:-$STAGING_DB_URL}"
          mkdir -p backup/db
          supabase db dump --db-url "$url" --role-only -f backup/db/roles.sql
          supabase db dump --db-url "$url" -f backup/db/schema.sql
          supabase db dump --db-url "$url" --data-only --use-copy -f backup/db/data.sql
          ls -l backup/db

      - name: Download the Storage files
        if: env.SOURCE == 'staging'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
        run: node scripts/backup-storage.mjs backup/storage

      - name: "Selftest: stop the source database"
        if: env.SOURCE == 'selftest'
        run: supabase stop --no-backup

      - name: Restore into a clean Supabase database
        run: |
          mkdir -p /tmp/restore && cd /tmp/restore
          supabase init --force >/dev/null
          supabase db start
          psql "$RESTORED_DB" -v ON_ERROR_STOP=1 --single-transaction \
            -f "$GITHUB_WORKSPACE/backup/db/roles.sql" \
            -f "$GITHUB_WORKSPACE/backup/db/schema.sql" \
            -c "SET session_replication_role = replica" \
            -f "$GITHUB_WORKSPACE/backup/db/data.sql"

      - name: Compare the restored database with the dump
        run: |
          chmod +x scripts/backup-verify.sh
          manifest=""
          [ -f backup/storage/manifest.json ] && manifest=backup/storage/manifest.json
          scripts/backup-verify.sh backup/db/data.sql "$RESTORED_DB" $manifest

      - name: Encrypt (age, public key)
        if: env.SOURCE == 'staging'
        env:
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          name="staging-$(date -u +%Y-%m-%d)"
          tar -czf - backup | age -r "$BACKUP_AGE_PUBLIC_KEY" -o "$name.tar.gz.age"
          rm -rf backup
          echo "BACKUP_FILE=$name.tar.gz.age" >> "$GITHUB_ENV"
          ls -l "$name.tar.gz.age"
          echo "### Záloha stagingu: $(du -h "$name.tar.gz.age" | cut -f1) zašifrovane" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: env.SOURCE == 'staging'
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 14
          if-no-files-found: error

      - name: Remove local copies
        if: always()
        run: rm -rf backup /tmp/restore
